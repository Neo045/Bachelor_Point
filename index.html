<title>Bachelor Point S05</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:20px 0;
  background: linear-gradient(135deg,#0f2027,#2c5364);
  overflow-y:auto;
}

html{
  scroll-behavior:smooth;
}

body::before{
  content:'';
  position:absolute;
  width:300px;
  height:300px;
  background:#00ffcc;
  filter:blur(80px);
  opacity:0.3;
  animation:pulse 5s infinite;
  z-index:0;
}

@keyframes pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.2);}
}

/* 🔥 PRELOADER */
#preloader{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:99999;
}

/* 🔥 ORIGINAL LOADER */
.loader {
  --path: white;
  --dot: #f40af0;
  --duration: 3s;
  width: 44px;
  height: 44px;
  position: relative;
  display:inline-block;
  margin: 0 16px; /* ✅ PERFECT SPACING */
}

.loader:before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  position: absolute;
  display: block;
  background: var(--dot);
  top: 37px;
  left: 19px;
  transform: translate(-18px, -18px);
  animation: dotRect var(--duration) cubic-bezier(0.785,0.135,0.15,0.86) infinite;
}

.loader svg {
  display: block;
  width: 100%;
  height: 100%;
}

.loader svg rect,
.loader svg polygon,
.loader svg circle {
  fill: none;
  stroke: var(--path);
  stroke-width: 10px;
  stroke-linejoin: round;
  stroke-linecap: round;
}

.loader svg polygon {
  stroke-dasharray: 145 76 145 76;
  animation: pathTriangle var(--duration) cubic-bezier(0.785,0.135,0.15,0.86) infinite;
}

.loader svg rect {
  stroke-dasharray: 192 64 192 64;
  animation: pathRect var(--duration) cubic-bezier(0.785,0.135,0.15,0.86) infinite;
}

.loader svg circle {
  stroke-dasharray: 150 50 150 50;
  stroke-dashoffset: 75;
  animation: pathCircle var(--duration) cubic-bezier(0.785,0.135,0.15,0.86) infinite;
}

.loader.triangle {
  width: 48px;
}

.loader.triangle:before {
  left: 21px;
  transform: translate(-10px, -18px);
  animation: dotTriangle var(--duration) cubic-bezier(0.785,0.135,0.15,0.86) infinite;
}

/* animations */
@keyframes pathTriangle {
  33% { stroke-dashoffset: 74; }
  66% { stroke-dashoffset: 147; }
  100% { stroke-dashoffset: 221; }
}

@keyframes dotTriangle {
  33% { transform: translate(0,0); }
  66% { transform: translate(10px,-18px); }
  100% { transform: translate(-10px,-18px); }
}

@keyframes pathRect {
  25% { stroke-dashoffset: 64; }
  50% { stroke-dashoffset: 128; }
  75% { stroke-dashoffset: 192; }
  100% { stroke-dashoffset: 256; }
}

@keyframes dotRect {
  25% { transform: translate(0,0); }
  50% { transform: translate(18px,-18px); }
  75% { transform: translate(0,-36px); }
  100% { transform: translate(-18px,-18px); }
}

@keyframes pathCircle {
  25% { stroke-dashoffset: 125; }
  50% { stroke-dashoffset: 175; }
  75% { stroke-dashoffset: 225; }
  100% { stroke-dashoffset: 275; }
}

.rain{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:1;
}

.rain span{
  position:absolute;
  width:2px;
  height:10px;
  background:#00ffcc;
  opacity:0.4;
  animation:fall linear infinite;
}

@keyframes fall{
  to{ transform:translateY(110vh); }
}

.container{
  position:relative;
  width:100%;
  max-width:360px;
  padding:20px;
  border-radius:20px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
  box-shadow:0 0 20px rgba(0,255,200,0.3);
  text-align:center;
  color:white;
  z-index:2;
}

.poster{
  width:100%;
  border-radius:15px;
}

.title{
  margin-top:10px;
  color:#00ffcc;
  text-shadow:0 0 8px #00ffcc;
}

.link-btn{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:none;
  border-radius:12px;
  background:rgba(0,255,200,0.2);
  color:white;
  cursor:pointer;
  transition:0.3s;
}

.link-btn:hover{
  background:#00ffcc;
  color:black;
  transform:scale(1.03);
}

.dvd{
  position:fixed;
  width:150px;
  z-index:999;
  pointer-events:none;
  filter:drop-shadow(0 0 10px #00ffcc);
}
</style>
</head>

<script>

};

const sound = document.getElementById("bgSound");

window.addEventListener("load",()=>{
  sound.play().catch(()=>{});

  // 🔥 hide loader
  setTimeout(()=>{
    document.getElementById("preloader").style.display="none";
  },800);
});

document.body.addEventListener("click",()=>{
  sound.play();
},{once:true});

const rain=document.querySelector('.rain');
for(let i=0;i<30;i++){
let d=document.createElement('span');
d.style.left=Math.random()*100+"vw";
d.style.animationDuration=(Math.random()*2+1)+"s";
rain.appendChild(d);
}

const dvd=document.querySelector('.dvd');
let x=100,y=100,dx=1.5,dy=1.5;

function animate(){
const w=innerWidth-dvd.clientWidth;
const h=innerHeight-dvd.clientHeight;

x+=dx;
y+=dy;

if(x<=0||x>=w)dx*=-1;
if(y<=0||y>=h)dy*=-1;

dvd.style.transform=`translate(${x}px,${y}px)`;
requestAnimationFrame(animate);
}
animate();

function go(key){
  const url = links[key];
  if(url){
    window.open(url, '_blank');
  }
}
</script>
